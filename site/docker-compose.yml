services:
  calculos-trabalhistas:
    image: calculos-trabalhistas:1.0
    build: .
    restart: unless-stopped
    init: true
    environment:
      APP_ORIGIN: https://${APP_HOST:-contabil.w4solution.com.br}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-silvacayke@gmail.com}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      DATA_DIR: /data
    secrets: [admin_password]
    volumes: [calculos_trabalhistas_data:/data]
    networks: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:8787/healthz',{headers:{Host:new URL(process.env.APP_ORIGIN).host}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  https:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports: ["80:80", "443:443"]
    environment:
      APP_HOST: ${APP_HOST:-contabil.w4solution.com.br}
    volumes:
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend, public]
    depends_on:
      calculos-trabalhistas:
        condition: service_healthy
networks:
  backend:
    internal: true
  public:
volumes:
  calculos_trabalhistas_data:
  caddy_data:
  caddy_config:
secrets:
  admin_password:
    file: ${ADMIN_PASSWORD_PATH:?Defina o caminho do arquivo de senha}
