services:
  calculos-trabalhistas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calculos-trabalhistas
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      # Defina um identificador estável se houver mais de uma instalação.
      WRANGLER_ENV: "production"
    volumes:
      - calculos_trabalhistas_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  calculos_trabalhistas_data:
